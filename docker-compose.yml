services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes: [ollama:/root/.ollama]
    # GPU: dùng thêm docker-compose.gpu.yml (cần nvidia-container-toolkit), xem Docs/05-local-setup.md

volumes:
  pgdata:
  ollama:
